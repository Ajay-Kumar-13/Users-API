spring:
  application:
    name: users

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/users
    username: postgres
    password: ajay

  datasource:
    url: jdbc:postgresql://localhost:5432/users
    username: postgres
    password: ajay

  sql:
    init:
      mode: always
      platform: postgres

  jpa:
    hibernate:
      ddl-auto: none

  app:
    jwtSecret: aGVsbG93b3JsZHRoaXNpc2FzZWN1cmVzZWNyZXQxMjM0NTY=
    accessTokenExpiration: 600000

  # AWS Secrets Manager starter tries to initialize an AWS client even when you’re using the default profile 
  cloud:
    aws:
      region:
        static: ap-south-1

logging:
  level:
    org.springframework.security: DEBUG
    com.crm.users: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true